name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
            arch: amd64
          - runner: ubuntu-22.04-arm
            os: linux
            arch: arm64
          - runner: macos-14
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: windows-latest
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # Configure release-signing with required reviewers and v* tag-only deployments.
    environment: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && ((matrix.os == 'darwin' && vars.MACOS_SIGNING_ENABLED == 'true') || (matrix.os == 'windows' && vars.WINDOWS_SIGNING_ENABLED == 'true')) && 'release-signing' || 'unsigned-build' }}
    permissions:
      contents: read
      actions: read
    env:
      SIGN_MACOS: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && matrix.os == 'darwin' && vars.MACOS_SIGNING_ENABLED == 'true' }}
      SIGN_WINDOWS: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows' && vars.WINDOWS_SIGNING_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting and development profile
        if: matrix.os == 'darwin' && matrix.arch == 'arm64'
        run: |
          make fmt-check
          python3 .devcontainer/cline-profile.py --self-test
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols rpm cpio desktop-file-utils xz-utils
      - name: Install Windows C compiler
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.arch == 'arm64' && 'CLANGARM64' || 'MINGW64' }}
          install: ${{ matrix.arch == 'arm64' && 'mingw-w64-clang-aarch64-clang' || 'mingw-w64-x86_64-gcc' }}
          update: true
      - name: Configure Windows C compiler
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          if ($env:TARGET_ARCH -eq 'arm64') {
            "$env:MSYS2_LOCATION\clangarm64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            "CC=clang" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CXX=clang++" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            "$env:MSYS2_LOCATION\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Install packager
        shell: bash
        run: sh scripts/install-packager.sh
      - name: Check native OS workflows
        shell: bash
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          test "$(go env GOOS)" = "$TARGET_OS"
          test "$(go env GOARCH)" = "$TARGET_ARCH"
          go vet -tags ci ./...
          # Go's race detector does not support windows/arm64.
          if [ "$TARGET_OS/$TARGET_ARCH" = windows/arm64 ]; then
            go test -tags ci -count=1 ./...
          else
            go test -tags ci -race -count=1 ./...
          fi
      - name: Package native app
        working-directory: cmd/dualcommander
        shell: bash
        run: |
          version=$(sh ../../scripts/version.sh)
          native_version=${version%%[-+]*}
          export GOFLAGS="-ldflags=-X=github.com/dualcommander/dualcommander/internal/commander.buildVersion=$version"
          # Ubuntu predefines fortification; Fyne appends its own level 3 definition.
          if [ "$(go env GOOS)" = linux ]; then export CGO_CFLAGS="${CGO_CFLAGS:--O2 -g} -U_FORTIFY_SOURCE"; fi
          fyne package -os ${{ matrix.os }} -release -app-version "$native_version"
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent cmd/dualcommander/DualCommander.app dist/dualcommander-darwin-${{ matrix.arch }}.zip
      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: |
          sh scripts/package-macos.sh
      - name: Sign and notarize macOS packages
        if: env.SIGN_MACOS == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        run: sh scripts/sign-macos.sh
      - name: Archive Linux package
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp cmd/dualcommander/DualCommander.tar.xz dist/dualcommander-linux-${{ matrix.arch }}.tar.xz
      - name: Build DEB and RPM packages
        if: runner.os == 'Linux'
        run: |
          sh scripts/package-linux.sh
      - name: Build classic Snap package
        if: runner.os == 'Linux'
        run: |
          sudo snap install snapcraft --classic
          sudo env "PATH=$PATH" make package-snap SNAPCRAFT_ARGS=--destructive-mode
      - name: Upload unsigned Windows app for SignPath
        if: env.SIGN_WINDOWS == 'true'
        id: unsigned-windows
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-${{ matrix.arch }}
          path: cmd/dualcommander/DualCommander.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign Windows app
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed-windows
      - name: Verify signed Windows app
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          EXPECTED_SIGNER: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:EXPECTED_SIGNER) { throw 'Missing WINDOWS_SIGNER_SUBJECT' }
          $exe = 'signed-windows/DualCommander.exe'
          $signature = Get-AuthenticodeSignature $exe
          if ($signature.Status -ne 'Valid') { throw "Invalid signature: $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -ne $env:EXPECTED_SIGNER) { throw 'Unexpected signing identity' }
          if (-not $signature.TimeStamperCertificate) { throw 'Missing Authenticode timestamp' }
          Copy-Item $exe cmd/dualcommander/DualCommander.exe -Force
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Compress-Archive -Path cmd/dualcommander/DualCommander.exe -DestinationPath dist/dualcommander-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dualcommander-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dualcommander-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          gh release upload "$RELEASE_TAG" dist/* --clobber

  windows-store:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && !contains(github.ref_name, '+') && vars.WINDOWS_STORE_ENABLED == 'true'
    needs: release
    runs-on: windows-latest
    environment: windows-store
    concurrency:
      group: windows-store
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v4
        with:
          pattern: dualcommander-windows-*
          path: windows-artifacts
          merge-multiple: true
      - name: Build Store MSIX bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          WINDOWS_STORE_IDENTITY_NAME: ${{ vars.WINDOWS_STORE_IDENTITY_NAME }}
          WINDOWS_STORE_PUBLISHER: ${{ vars.WINDOWS_STORE_PUBLISHER }}
          WINDOWS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.WINDOWS_STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory |
            Where-Object { Test-Path "$($_.FullName)\x64\makeappx.exe" } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'Windows SDK MakeAppx not found' }
          $makeappx = "$($sdk.FullName)\x64\makeappx.exe"
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force store-packages, store-output | Out-Null
          foreach ($arch in @('amd64', 'arm64')) {
            $stage = "store-stage/$arch"
            New-Item -ItemType Directory -Force "$stage/Assets" | Out-Null
            Expand-Archive "windows-artifacts/dualcommander-windows-$arch.zip" -DestinationPath $stage
            python scripts/windows-store.py "$stage/AppxManifest.xml" $arch
            if ($LASTEXITCODE -ne 0) { throw 'Store manifest generation failed' }
            $source = [System.Drawing.Image]::FromFile("$pwd/assets/dualcommander.png")
            try {
              foreach ($asset in @{ StoreLogo = 50; Logo = 150; SmallLogo = 44 }.GetEnumerator()) {
                $bitmap = [System.Drawing.Bitmap]::new($source, [int]$asset.Value, [int]$asset.Value)
                try { $bitmap.Save("$pwd/$stage/Assets/$($asset.Key).png", [System.Drawing.Imaging.ImageFormat]::Png) }
                finally { $bitmap.Dispose() }
              }
            } finally { $source.Dispose() }
            & $makeappx pack /d $stage /p "store-packages/dualcommander-$arch.msix" /o
            if ($LASTEXITCODE -ne 0) { throw "MSIX packaging failed: $arch" }
          }
          & $makeappx bundle /d store-packages /p store-output/dualcommander.msixbundle /o
          if ($LASTEXITCODE -ne 0) { throw 'MSIX bundling failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: dualcommander-windows-store
          path: store-output/*.msixbundle
          if-no-files-found: error
      - name: Install Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@271384ce0e6e03162184c55b05392e8f4044aa78 # v1.2
      - name: Publish Store submission
        env:
          WINDOWS_STORE_TENANT_ID: ${{ secrets.WINDOWS_STORE_TENANT_ID }}
          WINDOWS_STORE_SELLER_ID: ${{ secrets.WINDOWS_STORE_SELLER_ID }}
          WINDOWS_STORE_CLIENT_ID: ${{ secrets.WINDOWS_STORE_CLIENT_ID }}
          WINDOWS_STORE_CLIENT_SECRET: ${{ secrets.WINDOWS_STORE_CLIENT_SECRET }}
          WINDOWS_STORE_PRODUCT_ID: ${{ vars.WINDOWS_STORE_PRODUCT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($key in @('WINDOWS_STORE_TENANT_ID', 'WINDOWS_STORE_SELLER_ID', 'WINDOWS_STORE_CLIENT_ID', 'WINDOWS_STORE_CLIENT_SECRET', 'WINDOWS_STORE_PRODUCT_ID')) {
            if (-not [Environment]::GetEnvironmentVariable($key)) { throw "Missing $key" }
          }
          msstore reconfigure --tenantId $env:WINDOWS_STORE_TENANT_ID --sellerId $env:WINDOWS_STORE_SELLER_ID --clientId $env:WINDOWS_STORE_CLIENT_ID --clientSecret $env:WINDOWS_STORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw 'Store authentication failed' }
          msstore publish store-output/dualcommander.msixbundle --appId $env:WINDOWS_STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw 'Store submission failed' }