name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os: linux
            arch: amd64
          - runner: ubuntu-22.04-arm
            os: linux
            arch: arm64
          - runner: macos-14
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: windows-latest
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    # Configure release-signing with required reviewers and v* tag-only deployments.
    environment: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && ((matrix.os == 'darwin' && vars.MACOS_SIGNING_ENABLED == 'true') || (matrix.os == 'windows' && vars.WINDOWS_SIGNING_ENABLED == 'true')) && 'release-signing' || 'unsigned-build' }}
    permissions:
      contents: read
      actions: read
    env:
      SIGN_MACOS: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && matrix.os == 'darwin' && vars.MACOS_SIGNING_ENABLED == 'true' }}
      SIGN_WINDOWS: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows' && vars.WINDOWS_SIGNING_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting and development profile
        if: matrix.os == 'darwin' && matrix.arch == 'arm64'
        run: make fmt-check profile-check
      - name: Install Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols rpm cpio desktop-file-utils xz-utils
      - name: Install Windows C compiler
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.arch == 'arm64' && 'CLANGARM64' || 'MINGW64' }}
          install: ${{ matrix.arch == 'arm64' && 'mingw-w64-clang-aarch64-clang' || 'mingw-w64-x86_64-gcc' }}
          update: true
      - name: Configure Windows C compiler
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          if ($env:TARGET_ARCH -eq 'arm64') {
            "$env:MSYS2_LOCATION\clangarm64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            "CC=clang" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CXX=clang++" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            "$env:MSYS2_LOCATION\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
      - name: Install Make and 7-Zip on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make 7zip --no-progress -y
      - name: Install packager
        shell: bash
        run: make install-packager
      - name: Check native OS workflows
        shell: bash
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: make ci-check
      - name: Package native app
        shell: bash
        run: make package-native
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: make archive-macos
      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: make package-macos
      - name: Sign and notarize macOS packages
        if: env.SIGN_MACOS == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        run: make sign-macos
      - name: Archive Linux package
        if: runner.os == 'Linux'
        run: make archive-linux
      - name: Build DEB and RPM packages
        if: runner.os == 'Linux'
        run: make package-linux
      - name: Build classic Snap package
        if: runner.os == 'Linux'
        run: |
          sudo snap install snapcraft --classic
          sudo env "PATH=$PATH" make package-snap SNAPCRAFT_ARGS=--destructive-mode
      - name: Upload unsigned Windows app for SignPath
        if: env.SIGN_WINDOWS == 'true'
        id: unsigned-windows
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-${{ matrix.arch }}
          path: cmd/dualcommander/DualCommander.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign Windows app
        if: env.SIGN_WINDOWS == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed-windows
      - name: Verify signed Windows app
        if: env.SIGN_WINDOWS == 'true'
        env:
          EXPECTED_SIGNER: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
        run: make verify-windows
      - name: Archive Windows app
        if: runner.os == 'Windows'
        run: make archive-windows
      - uses: actions/upload-artifact@v4
        with:
          name: dualcommander-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-msix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: dualcommander-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: make publish-release

  apple-store:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && !contains(github.ref_name, '+') && vars.APPLE_STORE_ENABLED == 'true'
    needs: release
    runs-on: macos-14
    environment: apple-store
    concurrency:
      group: apple-store
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: dualcommander-darwin-*
          path: macos-artifacts
          merge-multiple: true
      - name: Build signed universal Store package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          APPLE_STORE_CERTIFICATE_BASE64: ${{ secrets.APPLE_STORE_CERTIFICATE_BASE64 }}
          APPLE_STORE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_STORE_CERTIFICATE_PASSWORD }}
          APPLE_STORE_PROFILE_BASE64: ${{ secrets.APPLE_STORE_PROFILE_BASE64 }}
          APPLE_STORE_APPLICATION_IDENTITY: ${{ vars.APPLE_STORE_APPLICATION_IDENTITY }}
          APPLE_STORE_INSTALLER_IDENTITY: ${{ vars.APPLE_STORE_INSTALLER_IDENTITY }}
          APPLE_STORE_BUNDLE_ID: ${{ vars.APPLE_STORE_BUNDLE_ID }}
          APPLE_STORE_TEAM_ID: ${{ vars.APPLE_STORE_TEAM_ID }}
        run: make package-apple-store APPLE_STORE_INPUT=macos-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: dualcommander-apple-store
          path: dist/apple-store/*.pkg
          if-no-files-found: error
      - name: Validate and upload Store build
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
          APPLE_STORE_APP_ID: ${{ vars.APPLE_STORE_APP_ID }}
          APPLE_STORE_PROVIDER_ID: ${{ vars.APPLE_STORE_PROVIDER_ID }}
          APPLE_STORE_BUNDLE_ID: ${{ vars.APPLE_STORE_BUNDLE_ID }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: make publish-apple-store

  windows-msix:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install Make on Windows
        shell: pwsh
        run: choco install make --no-progress -y
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v4
        with:
          pattern: dualcommander-windows-*
          path: windows-artifacts
          merge-multiple: true
      - name: Build Store MSIX bundle
        env:
          # Development/prerelease packages use a fixed sideload-only version.
          RELEASE_TAG: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-') && !contains(github.ref_name, '+') && github.ref_name || 'v0.0.1' }}
          WINDOWS_STORE_IDENTITY_NAME: 'PeterButkovic.DualCommander'
          WINDOWS_STORE_PUBLISHER: 'CN=1FB8D7A3-27B9-46F3-8458-4BAF7098A1BD'
          WINDOWS_STORE_PUBLISHER_DISPLAY_NAME: 'Peter Butkovic'
        run: make package-msix WINDOWS_STORE_INPUT=windows-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: dualcommander-windows-store
          path: dist/windows-store/*.msixbundle
          if-no-files-found: error

  windows-store:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && !contains(github.ref_name, '+') && vars.WINDOWS_STORE_ENABLED == 'true'
    needs: [release, windows-msix]
    runs-on: windows-latest
    environment: windows-store
    concurrency:
      group: windows-store
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Install Make on Windows
        shell: pwsh
        run: choco install make --no-progress -y
      - uses: actions/download-artifact@v4
        with:
          name: dualcommander-windows-store
          path: dist/windows-store
      - name: Install Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
      - name: Publish Store submission
        env:
          WINDOWS_STORE_TENANT_ID: ${{ secrets.WINDOWS_STORE_TENANT_ID }}
          WINDOWS_STORE_SELLER_ID: ${{ secrets.WINDOWS_STORE_SELLER_ID }}
          WINDOWS_STORE_CLIENT_ID: ${{ secrets.WINDOWS_STORE_CLIENT_ID }}
          WINDOWS_STORE_CLIENT_SECRET: ${{ secrets.WINDOWS_STORE_CLIENT_SECRET }}
          WINDOWS_STORE_PRODUCT_ID: ${{ vars.WINDOWS_STORE_PRODUCT_ID }}
        shell: bash
        run: make publish-windows-store