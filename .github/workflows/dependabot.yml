name: Dependabot maintenance

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed]
    branches: [main]

permissions: {}

jobs:
  auto-merge:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action != 'closed' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Never check out or execute PR code with this privileged token.
      - name: Enable auto-merge after required checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"

  delete-merged-branch:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Delete merged Dependabot branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/$HEAD_REF" --jq '.[].ref')
          if printf '%s\n' "$refs" | grep -Fxq "refs/heads/$HEAD_REF"; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF"
          fi
