# Release notes generated by https://git-cliff.org from Conventional Commits.
[changelog]
header = ""
body = """
## {{ version | default(value="Unreleased") }}
{% set_global change_count = 0 %}\
{% for group, commits in commits | group_by(attribute="group") %}
{% set_global group_started = false %}\
{% for commit in commits %}\
{% for change in commit.message | split(pat="\n") | first | split(pat=";") %}\
{% set change = change | trim %}\
{% if change != "" and (commit.breaking or not change is matching("(?i)(\\b(?:code|comments?|tests?) clean[ -]?ups?\\b|^clean[ -]?ups?(?:$|[ :_-]+(?:code|comments?|tests?)\\b)|^refactor\\w*\\b|^(?:dropping|removing|deleting|drop|remove|delete)\\b.*\\btests?\\b)")) %}\
{% if not group_started %}
### {{ group }}
{% set_global group_started = true %}\
{% endif %}\
{% set_global change_count = change_count + 1 %}\
- {% if commit.breaking %}**Breaking:** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ change | trim }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/dualcommander/dualcommander/commit/{{ commit.id }}))
{% endif %}\
{% endfor %}\
{% endfor %}
{% endfor %}
{% if change_count == 0 %}\
Maintenance release. See full changelog for details.
{% endif %}
{% if previous.version %}\
**Full Changelog**: https://github.com/dualcommander/dualcommander/compare/{{ previous.version }}...{{ version | default(value="HEAD") }}
{% else %}\
**Full Changelog**: https://github.com/dualcommander/dualcommander/commits/{{ version | default(value="HEAD") }}
{% endif %}\
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug fixes" },
    { message = "^perf", group = "Performance" },
    { message = ".*", skip = true },
]
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+"
use_branch_tags = true
sort_commits = "oldest"